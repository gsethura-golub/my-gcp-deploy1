---
- name: Deploy Python Hello World App to GCP VM
  hosts: all
  become: yes

  tasks:
    - name: Install system dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Ensure target directory exists
      file:
        path: /var/www/myapp
        state: directory
        mode: '0755'

    - name: Copy application files
      copy:
        src: ./
        dest: /var/www/myapp/
        mode: '0755'

    - name: Set up Python virtual environment and install requirements
      pip:
        requirements: /var/www/myapp/requirements.txt
        virtualenv: /var/www/myapp/venv
        virtualenv_command: python3 -m venv

    - name: Create systemd unit file for Flask app
      copy:
        dest: /etc/systemd/system/flaskapp.service
        content: |
          [Unit]
          Description=Flask Hello World Application
          After=network.target

          [Service]
          User=root
          WorkingDirectory=/var/www/myapp
          ExecStart=/var/www/myapp/venv/bin/python /var/www/myapp/app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd and start Flask service
      systemd:
        name: flaskapp
        state: restarted
        enabled: yes
        daemon_reload: yes
