---
- name: Deploy Python Hello World App to GCP
  hosts: webserver
  become: yes

  tasks:
    - name: Update apt cache and install dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /var/www/myapp
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy app files
      copy:
        src: "{{ item }}"
        dest: /var/www/myapp/
        owner: ubuntu
        group: ubuntu
      loop:
        - app.py
        - requirements.txt

    - name: Create virtual environment and install dependencies
      pip:
        requirements: /var/www/myapp/requirements.txt
        virtualenv: /var/www/myapp/venv
        virtualenv_command: python3 -m venv

    - name: Create systemd service unit for Flask app
      copy:
        dest: /etc/systemd/system/flaskapp.service
        content: |
          [Unit]
          Description=Flask Application
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/var/www/myapp
          ExecStart=/var/www/myapp/venv/bin/python3 app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd, enable and start flaskapp service
      systemd:
        name: flaskapp
        state: restarted
        enabled: yes
        daemon_reload: yes
