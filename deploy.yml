---
- name: Deploy Python Hello World App to GCP
  hosts: webserver
  become: yes

  tasks:
    - name: Update apt cache and install dependencies
      apt:
        name:
          - python3
          - python3-pip
          - python3-venv
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /var/www/myapp
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy app files
      copy:
        src: "{{ item }}"
        dest: /var/www/myapp/
        owner: ubuntu
        group: ubuntu
      loop:
        - app.py
        - requirements.txt

    - name: Create virtual environment and install dependencies
      pip:
        requirements: /var/www/myapp/requirements.txt
        virtualenv: /var/www/myapp/venv
        virtualenv_command: python3 -m venv

    - name: Create systemd service for app
      copy:
        dest: /etc/systemd/system/helloworld.service
        content: |
          [Unit]
          Description=Python Hello World Web App
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/opt/hello-world
          ExecStart=/opt/hello-world/venv/bin/gunicorn --bind 0.0.0.0:8080 app:app
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd, enable and start service
      systemd:
        name: helloworld
        daemon_reload: yes
        state: restarted
        enabled: yes
