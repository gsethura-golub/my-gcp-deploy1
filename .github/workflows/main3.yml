name: Test and Deploy to GCP3

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. LOCAL TEST IN GITHUB RUNNER
      - name: Run App and Test Response
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "Response from app: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Local test passed!"
          else
            echo "❌ Local test failed!"
            exit 1
          fi

      # 2. ANSIBLE DEPLOYMENT TO GCP VM
      - name: Install Ansible
        run: pip install ansible

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Pre-warm connection and propagate SSH keys to VM metadata
      - name: Configure SSH for IAP Tunneling
        run: |
          # 1. Create SSH directory and write explicit SSH config
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/config
          Host hello-world-vm
              HostName hello-world-vm
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
              StrictHostKeyChecking no
              UserKnownHostsFile /dev/null
              ProxyCommand gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=us-central1-a --project=prj-d-sandbox-01-452914
          EOF
          chmod 600 ~/.ssh/config

      # 2. Pre-warm connection to register SSH keys into VM metadata
      - name: Verify IAP SSH Connection
        run: |
          gcloud compute ssh hello-world-vm \
            --zone=us-central1-a \
            --project=prj-d-sandbox-01-452914 \
            --tunnel-through-iap \
            --command="echo 'IAP SSH Connection Successful'" \
            --ssh-flag="-o StrictHostKeyChecking=no"

      # 3. Simplify Inventory file (SSH config handles the tunneling details)
      - name: Inject GCP VM into Inventory
        run: |
          cat <<EOF > inventory.ini
          [web]
          hello-world-vm
          EOF

      - name: Run Ansible Deployment
        run: |
          ansible-playbook -i inventory.ini deploy.yml
