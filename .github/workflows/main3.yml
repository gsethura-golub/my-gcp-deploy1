name: Test and Deploy to GCP3

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. LOCAL TEST IN GITHUB RUNNER
      - name: Run App and Test Response
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "Response from app: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Local test passed!"
          else
            echo "❌ Local test failed!"
            exit 1
          fi

      # 2. ANSIBLE DEPLOYMENT TO GCP VM
      - name: Install Ansible
        run: pip install ansible

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 3. CONFIGURE OS LOGIN SSH ACCESS
      - name: Register SSH Key with OS Login & Fetch OS User
        run: |
          mkdir -p $HOME/.ssh
          ssh-keygen -t rsa -b 2048 -f $HOME/.ssh/id_rsa -N "" -q <<< y
          
          # Register key using absolute path $HOME
          gcloud compute os-login ssh-keys add \
            --key-file=$HOME/.ssh/id_rsa.pub \
            --ttl=1h
          
          # Extract the auto-generated OS Login username
          OS_USER=$(gcloud compute os-login describe-profile --format="value(posixAccounts[0].username)")
          echo "Detected OS Login Username: $OS_USER"
          echo "OS_USER=$OS_USER" >> $GITHUB_ENV

      # 4. INJECT INVENTORY WITH DYNAMIC OS LOGIN USER
      - name: Inject GCP VM into Inventory
        run: |
          cat <<EOF > inventory.ini
          [web]
          hello-world-vm

          [web:vars]
          ansible_user=${OS_USER}
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_remote_tmp=/tmp
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=us-central1-a --project=prj-d-sandbox-01-452914"'
          EOF

      - name: Run Ansible Deployment
        run: |
          ansible-playbook -i inventory.ini deploy.yml
