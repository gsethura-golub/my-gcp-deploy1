name: Test and Deploy to GCP3

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. LOCAL TEST IN GITHUB RUNNER
      - name: Run App and Test Response
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "Response from app: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Local test passed!"
          else
            echo "❌ Local test failed!"
            exit 1
          fi

      # 2. ANSIBLE DEPLOYMENT TO GCP VM
      - name: Install Ansible
        run: pip install ansible

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Inject GCP VM into Inventory
        run: |
          cat <<EOF > inventory.ini
          [web]
          hello-world-vm

          [web:vars]
          ansible_remote_tmp=/tmp
          ansible_ssh_executable=gcloud
          ansible_ssh_extra_args='compute ssh --zone=us-central1-a --project=prj-d-sandbox-01-452914 --tunnel-through-iap'
          EOF

      - name: Run Ansible Deployment
        run: |
          ansible-playbook -i inventory.ini deploy.yml
