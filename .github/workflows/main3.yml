name: Test and Deploy to GCP3

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. LOCAL TEST IN GITHUB RUNNER
      - name: Run App and Test Response
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "Response from app: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Local test passed!"
          else
            echo "❌ Local test failed!"
            exit 1
          fi

      # 2. ANSIBLE DEPLOYMENT TO GCP VM
      - name: Install Ansible
        run: pip install ansible

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # Generate dynamic key, upload to GCP, and wait for propagation
      - name: Setup SSH Key & Add to VM Metadata
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t rsa -b 2048 -f ~/.ssh/id_rsa -N "" -q
          
          # Register key on the instance
          gcloud compute instances add-metadata hello-world-vm \
            --zone=us-central1-a \
            --project=prj-d-sandbox-01-452914 \
            --metadata=ssh-keys="ubuntu:$(cat ~/.ssh/id_rsa.pub)"

          echo "Waiting 15s for GCP guest agent to propagate SSH key to the VM..."
          sleep 15

      # Create Inventory using native OpenSSH over IAP ProxyCommand
      - name: Inject GCP VM into Inventory
        run: |
          cat <<EOF > inventory.ini
          [web]
          hello-world-vm

          [web:vars]
          ansible_user=ubuntu
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30 -o ProxyCommand="gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone=us-central1-a --project=prj-d-sandbox-01-452914"'
          EOF

      - name: Run Ansible Deployment
        run: |
          ansible-playbook -i inventory.ini deploy.yml
