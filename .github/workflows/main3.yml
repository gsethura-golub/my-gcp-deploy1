name: Test and Deploy to GCP3

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1. LOCAL TEST IN GITHUB RUNNER
      - name: Run App and Test Response
        run: |
          python app.py &
          sleep 3
          RESPONSE=$(curl -s http://127.0.0.1:8080)
          echo "Response from app: $RESPONSE"
          
          if [[ "$RESPONSE" == *"Hello World"* ]]; then
            echo "✅ Local test passed!"
          else
            echo "❌ Local test failed!"
            exit 1
          fi

      # 2. ANSIBLE DEPLOYMENT TO GCP VM
      - name: Install Ansible
        run: pip install ansible

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GCP_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      # 👇 ADD GCP AUTHENTICATION & CLOUD SDK HERE 👇
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 👇 ADD IAP SSH CONFIGURATION HERE 👇
      - name: Configure SSH for IAP Tunneling
        run: |
          cat << 'EOF' >> ~/.ssh/config
          Host hello-world-vm ${{ secrets.GCP_VM_IP }}
              ProxyCommand gcloud compute start-iap-tunnel hello-world-vm 22 --listen-on-stdin --zone=us-central1-a --project=prj-d-sandbox-01-452914
              StrictHostKeyChecking no
              User ubuntu
              IdentityFile ~/.ssh/id_rsa
          EOF

      - name: Inject GCP VM IP into Inventory
        run: |
          sed -i 's/GCP_VM_PUBLIC_IP/${{ secrets.GCP_VM_IP }}/g' inventory.ini

      - name: Run Ansible Deployment
        run: |
          ansible-playbook -i inventory.ini deploy.yml
